<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>PROJEÇÃO - TELÃO</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background: black;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #player-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #espera-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        #espera-img.show {
            opacity: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        h2 {
            color: rgba(255, 255, 255, 0.22);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 400;
            font-size: 20px;
            letter-spacing: 2.5px;
            text-align: center;
            user-select: none;
        }
    </style>
</head>

<body>
    <div id="player-container">
        <img id="espera-img" alt="Tela de Espera">
        <h2 id="msg">Aguardando...</h2>
    </div>

    <script src="projetor.js"></script>
</body>

</html>
