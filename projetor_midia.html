<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PROJEÇÃO - MÍDIA</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw;
            height: 100vh;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #midiaImg {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.3s ease, opacity 0.4s ease;
            display: block;
        }
    </style>
</head>
<body>
    <img id="midiaImg" src="" alt="">
    <script src="projetor_midia.js"></script>
</body>
</html>
